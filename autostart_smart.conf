# QQ飞车智能识别配置文件
# Smart Recognition Configuration

# ============================================
# 基础设置
# ============================================
auto=1                      # 启用自动化
rename=1                    # 启用字符串混淆（反检测）
delay_ms=2500               # 启动延迟

# ============================================
# 智能识别设置
# ============================================
recognition=1               # 启用智能界面识别（1=启用，0=禁用）
check_interval=3000         # 界面检测间隔（毫秒）

# ============================================
# 反检测设置
# ============================================
random_delay_range=500      # 随机延迟范围（±500ms）
random_offset_pixels=15     # 随机位置偏移（±15像素）

# ============================================
# 按钮坐标配置（归一化坐标 0.0-1.0）
# 适配分辨率：2786×1080
# ============================================

# 游戏中自动跑图位置
ingame_x=0.50
ingame_y=0.86

# 【开始匹配】按钮（匹配准备界面）
match_btn_x=0.86
match_btn_y=0.88

# 【点击继续】按钮（结算页面）
continue_btn_x=0.89
continue_btn_y=0.88

# 【取消】按钮（一骑绝尘弹窗，左下角）
cancel_btn_x=0.31
cancel_btn_y=0.88

# 【再来一局】按钮（排行榜）
again_btn_x=0.79
again_btn_y=0.88

# 按压时间（毫秒）
hold_time_ms=60

# ============================================
# 工作原理说明
# ============================================
# 1. 系统每隔3秒（可调）自动截图并分析屏幕
# 2. 通过检测关键区域的颜色特征识别当前界面类型：
#    - 游戏中（整体较暗）
#    - 结算页面（右下角有按钮）
#    - 排行榜（右下角有按钮，在结算之后）
#    - 一骑绝尘弹窗（左右两侧都有按钮）
#    - 匹配准备界面（右下角有按钮）
# 3. 根据识别结果自动点击对应按钮
# 4. 添加随机延迟和位置偏移，模拟真人操作

# ============================================
# 反检测措施
# ============================================
# - 随机延迟：每次点击前后添加±500ms随机延迟
# - 随机位置：点击坐标添加±15像素随机偏移
# - 随机按压时间：按压时间在60ms基础上±10ms浮动
# - 字符串混淆：关键字符串被替换，避免特征检测
# - 内存加载：payload从内存加载，不写入磁盘

# ============================================
# 故障排除
# ============================================
# 如果识别不准确，可以尝试：
# 1. 调整check_interval（增加到5000-8000）
# 2. 查看logcat日志了解识别结果
# 3. 如果某个界面经常识别错误，可能需要调整按钮坐标

# ============================================
# 查看日志命令
# ============================================
# adb logcat | grep "jit:"
#
# 日志示例：
# jit: recognize: detected SETTLEMENT (right bright, center dark)
# jit: action: state=SETTLEMENT tap=(0.89, 0.88)
# jit: tap: x=2473 y=2454 (0.890, 0.880) w=2786 h=2788
