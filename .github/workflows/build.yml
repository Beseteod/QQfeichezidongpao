name: Build R10 Smart Recognition

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Download core.bin from release
      run: |
        echo "正在下载 core.bin..."
        wget https://github.com/Beseteod/QQfeichezidongpao/releases/download/v1.0/core.bin
        ls -lh core.bin

    - name: Download NDK
      run: |
        echo "正在下载 Android NDK..."
        wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
        echo "正在解压 NDK..."
        unzip -q android-ndk-r26d-linux.zip
        echo "NDK 准备完成"
        echo "NDK=$PWD/android-ndk-r26d" >> $GITHUB_ENV

    - name: Build module
      run: |
        echo "开始编译智能识别版本..."
        $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android24-clang++ \
          -shared -fPIC -O2 -fvisibility=hidden -fno-exceptions -fno-rtti \
          -Wall -Wextra -Wno-unused-parameter \
          -Wl,-soname,libzext.so -Wl,--hash-style=both -Wl,-z,max-page-size=16384 \
          -nostdlib++ -o arm64-v8a.so main_smart_recognition.cpp -llog -ldl -ljnigraphics

        echo "优化二进制文件..."
        $NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-strip --strip-unneeded arm64-v8a.so

        echo "编译完成！"
        ls -lh arm64-v8a.so

    - name: Check required files
      run: |
        echo "检查必需文件..."
        echo "=== 当前目录文件 ==="
        ls -la
        echo ""
        echo "=== 检查必需文件 ==="
        test -f module.prop && echo "✓ module.prop 存在" || echo "✗ module.prop 缺失"
        test -f customize.sh && echo "✓ customize.sh 存在" || echo "✗ customize.sh 缺失"
        test -f autostart_smart.conf && echo "✓ autostart_smart.conf 存在" || echo "✗ autostart_smart.conf 缺失"
        test -f core.bin && echo "✓ core.bin 存在" || echo "✗ core.bin 缺失"
        test -f arm64-v8a.so && echo "✓ arm64-v8a.so 存在" || echo "✗ arm64-v8a.so 缺失"

    - name: Package module
      run: |
        echo "打包智能识别模块..."
        mkdir -p R10_Smart/zygisk

        # 复制文件
        cp arm64-v8a.so R10_Smart/zygisk/
        cp module.prop R10_Smart/
        cp customize.sh R10_Smart/
        cp autostart_smart.conf R10_Smart/autostart.conf
        cp core.bin R10_Smart/

        # 设置权限
        chmod 755 R10_Smart/customize.sh
        chmod 644 R10_Smart/zygisk/arm64-v8a.so
        chmod 644 R10_Smart/autostart.conf
        chmod 644 R10_Smart/core.bin
        chmod 644 R10_Smart/module.prop

        # 显示目录结构
        echo "=== 模块目录结构 ==="
        ls -laR R10_Smart/

        # 打包
        cd R10_Smart
        zip -r ../R10_v3_Smart_Recognition.zip *
        cd ..

        echo "=== 打包完成 ==="
        ls -lh R10_v3_Smart_Recognition.zip

        # 验证ZIP内容
        echo "=== ZIP内容验证 ==="
        unzip -l R10_v3_Smart_Recognition.zip

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: R10_v3_Smart_Recognition
        path: R10_v3_Smart_Recognition.zip

    - name: Upload .so file (debug)
      uses: actions/upload-artifact@v4
      with:
        name: arm64-v8a-smart
        path: arm64-v8a.so
